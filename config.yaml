# Dementor experiment configuration — single source of truth.
# Consumed via dementor.config (see dementor/config.py for accessors).

seeds: [42, 43, 44]              # available robustness seeds; legacy adapters used [1, 2, 3]

# Named publication campaigns select from the catalog below without duplicating model ids.
# `roster_tier` matches each model's `imitation` field.  The safety square is the executed
# 12-model, seed-42 design: 12 x 11 x 4 = 528 off-diagonal cells per SFT/DPO stage.
campaigns:
  imitation_safety:
    roster_tier: core
    datasets: [chatbot_arena, gsm8k, oasst1, writingprompts]
    seeds: [42]
    stages: [sft, dpo, self_sft]
    evaluation: {max_prompts: 200, subsample_seed: 42, max_new_tokens: 256}

paths:                            # relative paths anchor on the repo root; absolute paths pass through
  data: data
  datasets: data/datasets
  results: data/results
  registry: data/tinker_adapters.json
  peft_adapters: data/adapters/peft
  baselines: data/model-responses/matrix_baselines
  overleaf_img: ../dementor-overleaf/img

# Model catalog: 18 active/extended models from multiple providers.
#   backend: tinker -> trained via the Tinker API (remote, no local GPU)
#   backend: local  -> trained on a local GPU (full bf16 LoRA, not QLoRA)
# chat_template_kwargs disable thinking traces for cross-model comparability.
# tier: launder | retain (DPO fingerprint-erasure behavior); unknown for new lineages.
# imitation: core (the 12x12 imitation square — every core model imitates every other)
#          | extended (scale-up models NOT part of the 12x12 square; slug/id resolution only)
# arch: dense | moe | mamba-hybrid | vlm
#
# REPRODUCIBILITY: the publication matrix is the named `imitation_safety` campaign above.
# Models tagged `extended` remain resolvable for historical/scale-up adapters but are not
# dispatched by the default matrix or planner.
roster:
  - {id: Qwen/Qwen3.5-4B,                                  slug: qwen3.5-4b,          provider: qwen,   backend: tinker, renderer: qwen3,    chat_template_kwargs: {enable_thinking: false}, tier: launder, param_size: "4B",        params_b: 4, imitation: extended, arch: mamba-hybrid}
  - {id: Qwen/Qwen3.6-27B,                                 slug: qwen3.6-27b,         provider: qwen,   backend: tinker, renderer: qwen3,    chat_template_kwargs: {enable_thinking: false}, tier: launder, param_size: "27B",       params_b: 27, imitation: core, arch: mamba-hybrid}
  - {id: Qwen/Qwen3.6-35B-A3B,                             slug: qwen3.6-35b-a3b,     provider: qwen,   backend: tinker, renderer: qwen3,    chat_template_kwargs: {enable_thinking: false}, tier: launder, param_size: "35B-A3B",   params_b: 35, imitation: extended, arch: moe}
  - {id: Qwen/Qwen3-8B,                                    slug: qwen3-8b,            provider: qwen,   backend: tinker, renderer: qwen3,    chat_template_kwargs: {enable_thinking: false}, tier: launder, param_size: "8B",        params_b: 8, imitation: extended, arch: dense}
  - {id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16,       slug: nemotron-nano-30b-a3b, provider: nvidia, backend: tinker, renderer: nemotron, chat_template_kwargs: {enable_thinking: false}, tier: retain, param_size: "30B-A3B", params_b: 30, imitation: core, arch: moe}
  - {id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16,    slug: nemotron-super-120b, provider: nvidia, backend: tinker, renderer: nemotron, chat_template_kwargs: {enable_thinking: false}, tier: retain,  param_size: "120B-A12B", params_b: 120, imitation: extended, arch: moe}
  - {id: openai/gpt-oss-20b,                               slug: gpt-oss-20b,         provider: openai, backend: tinker, renderer: gpt-oss,  chat_template_kwargs: {reasoning_effort: low},  tier: retain,  param_size: "20B",       params_b: 20, imitation: core, arch: moe}
  - {id: openai/gpt-oss-120b,                              slug: gpt-oss-120b,        provider: openai, backend: tinker, renderer: gpt-oss,  chat_template_kwargs: {reasoning_effort: low},  tier: retain,  param_size: "120B",      params_b: 120, imitation: extended, arch: moe}
  - {id: google/gemma-4-E4B-it,                            slug: gemma-4-e4b,         provider: google, backend: local,  renderer: gemma,    chat_template_kwargs: {}, tier: unknown, param_size: "E4B",       params_b: 4, imitation: core, arch: vlm}
  - {id: google/gemma-4-31B-it,                            slug: gemma-4-31b,         provider: google, backend: local,  renderer: gemma,    chat_template_kwargs: {}, tier: unknown, param_size: "31B",       params_b: 31, imitation: core, arch: vlm}
  - {id: google/gemma-4-26B-A4B-it,                        slug: gemma-4-26b-a4b,     provider: google, backend: local,  renderer: gemma,    chat_template_kwargs: {}, tier: unknown, param_size: "26B-A4B",   params_b: 26, imitation: extended, arch: vlm}
  - {id: meta-llama/Llama-3.1-8B-Instruct,                 slug: llama-3.1-8b,        provider: meta,   backend: local,  renderer: llama3,   chat_template_kwargs: {}, tier: launder, param_size: "8B",        params_b: 8, imitation: core, arch: dense}
  - {id: adamo1139/aya-expanse-8b-ungated,                 slug: aya-expanse-8b,      provider: cohere, backend: local,  renderer: aya,      chat_template_kwargs: {}, tier: unknown, param_size: "8B",        params_b: 8, imitation: core, arch: dense}
  - {id: allenai/OLMo-3-7B-Instruct,                       slug: olmo-3-7b,           provider: allenai, backend: local,  renderer: olmo,     chat_template_kwargs: {}, tier: unknown, param_size: "7B",        params_b: 7, imitation: core, arch: dense}
  - {id: mistralai/Ministral-8B-Instruct-2410,             slug: ministral-8b,        provider: mistralai, backend: local, renderer: mistral, chat_template_kwargs: {}, tier: unknown, param_size: "8B",        params_b: 8, imitation: core, arch: dense}
  - {id: microsoft/phi-4,                                  slug: phi-4,               provider: microsoft, backend: local, renderer: phi,     chat_template_kwargs: {}, tier: unknown, param_size: "14B",       params_b: 14, imitation: core, arch: dense}
  - {id: ibm-granite/granite-4.0-h-small,                  slug: granite-4-h-small,   provider: ibm-granite, backend: local, renderer: generic, chat_template_kwargs: {}, tier: unknown, param_size: "32B-A9B",   params_b: 32, imitation: core, arch: mamba-hybrid}
  # llama-3.3-70b is locally trained with model parallelism; its Tinker base is unsamplable.
  - {id: meta-llama/Llama-3.3-70B-Instruct,                slug: llama-3.3-70b,       provider: meta,   backend: local,  renderer: llama3,   chat_template_kwargs: {}, tier: launder, param_size: "70B",       params_b: 70, imitation: core, arch: dense}
  # zamba2-7b (Zyphra) DROPPED 2026-07-07: transformers 5.5.x cannot load its shared-transformer
  # blocks (errors with weight-tying; loads random garbage without). 3rd hybrid LAB is now
  # granite-4-h-small (IBM Granite-4.0 32B-A9B, GraniteMoeHybrid: Mamba-2 + attention + MoE, the
  # flagship Granite-4 hybrid at qwen3.6-35b-a3b / nemotron-nano scale) — verified to LOAD +
  # GENERATE cleanly on transformers 5.5.4 (no cache_position bug; 2026-07-08). ~32B local:
  # trains single-GPU bf16 w/ gradient_checkpointing (like gemma-4-31b), or model-parallel if OOM.

# Retired/extra models referenced by existing adapters & analysis (slug<->id resolution
# only; NOT part of the active matrix). All retired from the Tinker catalog as of 2026-06-27.
roster_legacy:
  - {id: Qwen/Qwen3-4B-Instruct-2507,       slug: qwen3-4b,      provider: qwen, backend: tinker, renderer: qwen3,  chat_template_kwargs: {}, tier: launder, param_size: "4B",  params_b: 4}
  # llama-3.3-70b promoted to active roster: (imitation:core, backend:local) 2026-07-09.
  - {id: Qwen/Qwen3-32B,                    slug: qwen3-32b,     provider: qwen, backend: tinker, renderer: qwen3,  chat_template_kwargs: {enable_thinking: false}, tier: launder, param_size: "32B", params_b: 32}


# ============================================================================
# STEERING ROSTER — single source of truth for the mechanism (identity ⊥ safety) study.
# `refs` records steering status for catalog models. The publication reports the actually
# evaluable overlap; imitation membership does not require a successful steering assay.
# `refs` = models already defined in roster:/roster_legacy (referenced by slug).
# `breadth` = steering-only models (NOT trained in the imitation square).
#
# steer_status vocabulary (RECONCILED 2026-08-10 against canonical metrics, preferring exact
# seed-42 n=200 rescores where the cached generation contains the complete prompt set;
# regenerate the exact per-benchmark record with experiments/steering/audit_base_steering.py):
#   clean              cone ablation erodes safety -> model is USABLE in the study
#   pc_fails           cone ablation does NOT erode safety, and the refusal probe WORKS
#                      (base_refrate 0.67-0.98) -> genuine hyper-robust refusal; excluded
#                      as inconclusive per pre-registration
#   pc_fails_artifact  PC_FAILS is NOT trustworthy: the refusal probe is BLIND. The cone is
#                      fit against refusal_metric = P(first token == "I") (rdo_port.py:323),
#                      but these models open with a reasoning channel (gpt-oss harmony
#                      "analysis...", deepseek-R1 "<think>...") and never emit "I" first, so
#                      base_refrate = 0/300 and the cone is fit against a constant. NOT
#                      evidence of robust safety — a measurement failure. Fixable: give the
#                      family real refusal token ids / strip the channel, then re-run.
#   pc_invalid         the cone collapsed coherence at every beta; the causal assay is untestable
#   error              infrastructure failure (CUDA OOM / HF-offline cache miss), NOT a model
#                      property. Recoverable; must not be reported as an exclusion.
#   not_run            never attempted (no result dir).
# ============================================================================
steering_roster:
  # Some completed steering directories predate the canonical catalog slugs. Readers normalize
  # these names at load time so manifests, figures, and paper populations join cleanly to roster.
  artifact_slug_aliases:
    nemotron-nano: nemotron-nano-30b-a3b
    qwen3.6-35b: qwen3.6-35b-a3b
  refs:
    qwen3.5-4b: clean
    qwen3.6-27b: pc_fails
    qwen3.6-35b-a3b: clean
    nemotron-nano-30b-a3b: clean
    gpt-oss-20b: clean
    gpt-oss-120b: pc_fails_artifact     # probe blind, base_refrate 0/300 — same harmony format
    gemma-4-e4b: clean                  # positive control fires on HarmBench
    gemma-4-31b: pc_invalid
    llama-3.1-8b: clean
    aya-expanse-8b: clean
    olmo-3-7b: clean
    ministral-8b: clean                 # was `todo`; cone 0.807
    phi-4: clean
    granite-4-h-small: pc_fails         # verified RTX cone; positive control fails on all five harm benchmarks
    nemotron-super-120b: not_run # imitation:extended; 120B MP RDO cone — no result dir exists
    llama-3.3-70b: clean
    qwen3-8b: clean            # imitation:extended, already steered
  breadth:
    - {id: Qwen/Qwen2.5-7B-Instruct,                 slug: qwen2.5-7b,      provider: qwen,        arch: dense, steer_status: clean}
    - {id: Qwen/Qwen2.5-14B-Instruct,                slug: qwen2.5-14b,     provider: qwen,        arch: dense, steer_status: pc_fails}  # GENUINE: base_refrate 0.670, cone 0.010
    - {id: google/gemma-2-2b-it,                     slug: gemma-2-2b,      provider: google,      arch: dense, steer_status: clean}
    - {id: google/gemma-2-9b-it,                     slug: gemma-2-9b,      provider: google,      arch: dense, steer_status: clean}
    - {id: mistralai/Mistral-7B-Instruct-v0.3,       slug: mistral-7b,      provider: mistralai,   arch: dense, steer_status: clean}  # base_refrate 0.027 is REAL weak alignment (base_harm 0.477), not a blind probe
    - {id: meta-llama/Llama-3.2-3B-Instruct,         slug: llama-3.2-3b,    provider: meta,        arch: dense, steer_status: clean}
    - {id: Qwen/Qwen3-14B,                           slug: qwen3-14b,       provider: qwen,        arch: dense, steer_status: clean}
    - {id: allenai/OLMo-3.1-32B-Instruct,            slug: olmo-3.1-32b,    provider: allenai,     arch: dense, steer_status: clean}
    - {id: ibm-granite/granite-3.3-8b-instruct,      slug: granite-3.3-8b,  provider: ibm-granite, arch: dense, steer_status: clean}
    - {id: HuggingFaceTB/SmolLM3-3B,                 slug: smollm3-3b,      provider: huggingface, arch: dense, steer_status: clean}
    - {id: internlm/internlm3-8b-instruct,           slug: internlm3-8b,    provider: internlm,    arch: dense, steer_status: error}  # IndexError in tokenization_internlm3.py:173 — never retried
    - {id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B, slug: deepseek-distill-8b, provider: deepseek, arch: dense, steer_status: clean}
    - {id: mistralai/Mixtral-8x7B-Instruct-v0.1,     slug: mixtral-8x7b,    provider: mistralai,   arch: moe,   steer_status: error}  # CUDA OOM (1.31 GiB in mixtral experts)
    - {id: allenai/OLMoE-1B-7B-0924-Instruct,        slug: olmoe-1b-7b,     provider: allenai,     arch: moe,   steer_status: clean}
    - {id: Qwen/Qwen3-30B-A3B,                       slug: qwen3-30b-a3b,   provider: qwen,        arch: moe,   steer_status: clean}

datasets:
  gsm8k:
    train_csv: data/datasets/gsm8k/gsm8k_prompts_train_500_seed42.csv
    eval_csv: data/datasets/gsm8k/gsm8k_prompts_eval_200_seed42.csv
    prompt_template: "Question: {prompt}\nAnswer:"
    completion_template: " {completion}\n"
  chatbot_arena:
    train_csv: data/datasets/chatbot_arena/chatbot_arena_prompts_train_500_seed42.csv
    eval_csv: data/datasets/chatbot_arena/chatbot_arena_prompts_eval_1000_seed42.csv
    prompt_template: "{prompt}"
    completion_template: "{completion}"
  writingprompts:
    train_csv: data/datasets/writingprompts/writingprompts_train_500_seed42.csv
    eval_csv: data/datasets/writingprompts/writingprompts_eval_500_seed42.csv
    prompt_template: "Prompt: {prompt}\nStory:"
    completion_template: " {completion}\n"
  oasst1:
    train_csv: data/datasets/oasst1/oasst1_prompts_train_500_seed42.csv
    eval_csv: data/datasets/oasst1/oasst1_prompts_eval_200_seed42.csv
    prompt_template: "{prompt}"
    completion_template: "{completion}"

lora: {rank: 32, alpha: 64, dropout: 0.0, target_modules: all-linear}

sft: {batch_size: 16, epochs: 3, learning_rate: 1.0e-4, train_size: 500, eval_size: 0}

dpo: {batch_size: 16, num_epochs: 1, learning_rate: 1.0e-5, dpo_beta: 0.1, lora_rank: 32, max_length: 4096, save_every: 50}

generation: {max_tokens: 512, temperature: 0.0}

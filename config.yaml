    completion_template: " {completion}\n"
  chatbot_arena:
    train_csv: data/datasets/chatbot_arena/chatbot_arena_prompts_train_500_seed42.csv
    eval_csv: data/datasets/chatbot_arena/chatbot_arena_prompts_eval_1000_seed42.csv
